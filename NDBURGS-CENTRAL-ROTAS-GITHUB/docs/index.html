<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17131f">
  <title>ND BURGS | Central de Rotas</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 0,#35205d 0,transparent 42%),linear-gradient(145deg,#11101a,#20152e);color:#fff;font-family:Arial,sans-serif}.card{width:min(100%,520px);padding:36px 28px;border:1px solid #ffffff24;border-radius:24px;background:#ffffff0c;box-shadow:0 24px 80px #0008;text-align:center}.logo{font-size:clamp(34px,8vw,54px);font-weight:900;letter-spacing:2px}.logo span{color:#b98cff}.tag{color:#c9bfd8;line-height:1.6;margin:12px 0 28px}.btn{display:inline-block;padding:15px 24px;border-radius:14px;background:linear-gradient(110deg,#6d35d5,#a044e8);color:#fff;text-decoration:none;font-weight:800;box-shadow:0 8px 28px #853de866}.note{font-size:12px;color:#a99db8;margin-top:22px;line-height:1.5}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">ND <span>BURGS</span></div>
    <h1>Central de Rotas</h1>
    <p class="tag">Painel de entregas, motoboys e acompanhamento de pedidos.</p>
    <a class="btn" href="COLE_AQUI_A_URL_DO_APP_SCRIPT" id="openSystem">ACESSAR SISTEMA</a>
    <p class="note">Página inicial hospedada no GitHub Pages. O sistema operacional continua no Google Apps Script para preservar login, GPS e atualizações.</p>
  </main>
  <script>
    const link=document.getElementById('openSystem');
    if(link.getAttribute('href')==='COLE_AQUI_A_URL_DO_APP_SCRIPT'){
      link.addEventListener('click',e=>{e.preventDefault();alert('Edite docs/index.html e cole o endereço publicado do Web App do Google Apps Script no link do botão.');});
    }
  </script>
</body>
</html>
